<!DOCTYPE html>
<html lang="pt-BR">
<head>
{{head}}
</head>
<body>
<div class="brand-intro" aria-hidden="true" inert></div>
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
{{header}}
<main id="conteudo">
  <section class="landing-hero" aria-labelledby="hero-title">
    <div class="hero-background" aria-hidden="true">
      <picture>
        <source media="(max-width: 768px), (hover: none) and (pointer: coarse)" srcset="/assets/hero/nodrah-hero-violet.jpg">
        <img class="hero-media" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/130837c4-0244-4f37-9c61-8d801d93fd29.jpg" width="1536" height="1024" alt="" fetchpriority="high">
      </picture>
      <video class="hero-video" muted loop playsinline preload="none" data-mobile-src="/assets/hero/nodrah-hero-violet-mobile.mp4" data-mobile-poster="/assets/hero/nodrah-hero-violet.jpg" data-poster="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/130837c4-0244-4f37-9c61-8d801d93fd29.jpg" data-src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260912_104303_0c6d60b2-9353-408e-9449-585108a22fb5.mp4"></video>
    </div>
    <div class="hero-content">
      <h1 id="hero-title" class="section-label">NODRAH PARA {{niche}}</h1>
      <div class="form-section" id="formulario" aria-label="Encontre a solução para seu consultório">
        <div class="form-card">
{{form}}
        </div>
      </div>
    </div>
    <p class="hero-status" role="status" hidden></p>
  </section>
</main>
{{footer}}
<script type="module" src="/assets/landing/js/navigation.js"></script>
<script type="module" src="/assets/landing/js/motion.js"></script>
<script type="module" src="/assets/landing/js/hero-video.js"></script>
<script type="module" src="/assets/landing/js/lead-form.js?v=netlify-forms-1"></script>
</body>
</html>
