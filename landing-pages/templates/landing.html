<!DOCTYPE html>
<html lang="pt-BR">
<head>
{{head}}
</head>
<body class="landing-page">
<div class="brand-intro" aria-hidden="true" inert></div>
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
{{header}}
<div class="landing-scene">
  <div class="hero-background" aria-hidden="true">
    <div class="pattern-waves" id="nodrah-pattern-waves"></div>
  </div>
<main id="conteudo">
  <section class="landing-hero" aria-labelledby="hero-title">
    <div class="hero-content">
      <h1 id="hero-title" class="section-label">NODRAH PARA {{niche}}</h1>
      <div class="form-section" id="formulario" aria-label="Encontre a solução para seu consultório">
        <div class="form-card">
{{form}}
        </div>
      </div>
    </div>
    <p class="hero-status" role="status" hidden></p>
  </section>
</main>
{{footer}}
</div>
<script type="module" src="/assets/landing/js/navigation.js"></script>
<script type="module" src="/assets/landing/js/motion.js"></script>
<script type="module" src="/assets/hero/hero-waves.bundle.js"></script>
<script type="module" src="/assets/landing/js/lead-form.js?v=netlify-forms-1"></script>
</body>
</html>
